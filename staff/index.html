<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Staff Sign In | Kehilat Shaare Shalom</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css?v=admin-1">
  </head>
  <body class="admin-page">
    <div class="site-loader" aria-hidden="true"><span></span></div>
    <script>
      (() => {
        const loaderDelay = window.setTimeout(() => {
          if (document.readyState === "loading") document.documentElement.classList.add("is-rendering-slow");
        }, 900);
        const clearLoader = () => {
          window.clearTimeout(loaderDelay);
          document.documentElement.classList.remove("is-rendering-slow");
        };
        document.addEventListener("DOMContentLoaded", clearLoader, { once: true });
        window.addEventListener("pageshow", clearLoader, { once: true });
      })();
    </script>
    <main class="admin-shell">
      <section class="admin-hero" aria-labelledby="admin-title">
        <a class="admin-home" href="/">Kehilat Shaare Shalom</a>
        <h1 id="admin-title">Staff Sign In</h1>
      </section>

      <section class="admin-card" id="admin-login-panel" aria-labelledby="login-title">
        <h2 id="login-title">Staff Sign In</h2>
        <form id="admin-login-form" class="admin-form">
          <label>
            <span>Password</span>
            <input name="password" type="password" autocomplete="current-password" required>
          </label>
          <button class="button primary" type="submit">Sign In</button>
        </form>
      </section>

      <section class="admin-card" id="admin-editor-panel" hidden aria-labelledby="editor-title">
        <div class="admin-card-header">
          <div>
            <p class="eyebrow">Live Content</p>
            <h2 id="editor-title">Board Updates</h2>
            <p id="admin-updated" class="admin-muted">No saved updates yet.</p>
          </div>
        </div>

        <form id="admin-content-form" class="admin-editor">
          <fieldset class="admin-priority-section">
            <legend>Announcement</legend>
            <div id="admin-announcements" class="admin-rows"></div>
            <button class="button secondary admin-add" type="button" data-add-announcement>Add Announcement</button>
          </fieldset>

          <details class="admin-times-panel" open>
            <summary>Edit regular times</summary>
            <div class="admin-times-fields">
              <fieldset>
                <legend>Regular Minyanim</legend>
                <div id="admin-weekday" class="admin-rows"></div>
              </fieldset>

              <fieldset>
                <legend>Friday Night</legend>
                <div id="admin-fridayNight" class="admin-rows"></div>
              </fieldset>

              <fieldset>
                <legend>Shabbat Morning</legend>
                <div id="admin-morning" class="admin-rows"></div>
              </fieldset>

              <fieldset>
                <legend>Shabbat Afternoon</legend>
                <div id="admin-afternoon" class="admin-rows"></div>
              </fieldset>
            </div>
          </details>

          <div class="admin-actions">
            <button class="button primary" type="submit">Save Updates</button>
          </div>
        </form>

        <form id="admin-bulletin-form" class="admin-upload">
          <div>
            <p class="eyebrow">Weekly Bulletin</p>
            <h3>Upload PDF</h3>
            <p id="admin-bulletin-meta" class="admin-muted">No bulletin uploaded yet.</p>
          </div>
          <label class="admin-file">
            <span>Choose Bulletin PDF</span>
            <input id="admin-bulletin-file" name="bulletin" type="file" accept="application/pdf,.pdf" required>
          </label>
          <button class="button primary" type="submit">Upload and Parse</button>
        </form>

        <div class="admin-secondary-actions">
          <a class="button secondary" href="/">View Site</a>
          <button class="button secondary" id="admin-logout" type="button">Log Out</button>
        </div>
      </section>

      <p id="admin-status" class="admin-status" aria-live="polite"></p>
    </main>

    <script src="/admin.js?v=admin-2"></script>
  </body>
</html>
